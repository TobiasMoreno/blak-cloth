<div class="min-h-[100svh] bg-[#f4f4f0] text-[#0b0b0b]">
  <a
    href="#main-content"
    class="fixed left-4 top-3 z-[10000] -translate-y-24 bg-[#0b0b0b] px-4 py-3 font-semibold text-white transition-transform focus:translate-y-0"
  >
    Saltar al contenido
  </a>
  @if (isNavigating()) {
    <div class="route-progress-bar" role="progressbar" aria-label="Cargando página"></div>
  }
  <app-header />
  <main id="main-content" tabindex="-1" class="min-h-[100svh] bg-[#f4f4f0]">
    <router-outlet />
  </main>
  <app-footer />
  <app-toast />
</div>
